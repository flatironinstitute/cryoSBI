# Multi-particle image simulation parameters
n_pixels: 128
pixel_size: 1.5         # Angstrom per pixel
sigma: [2.0, 2.0]       # Gaussian width [min, max] in Angstrom
model_file: /home/dingeldein/Desktop/p4p6_pdb_models_dec_25/models_set0.pt         # Path to model file (.pt or .npy) — required
shift: 15.0             # Max in-plane shift magnitude in Angstrom
defocus: [1.5, 3.5]     # CTF defocus range [min, max] in micrometers
snr: [0.5, 0.5]         # Signal-to-noise ratio range [min, max] (log10 scale)
amp: 0.1                # Amplitude contrast
b_factor: [1.0, 100.0]  # B-factor range [min, max]

# Multi-particle-specific parameters
n_bg_min: 3             # Minimum number of background particles per image
n_bg_max: 10            # Maximum number of background particles per image
padding_factor: 2       # Padded box side = padding_factor * n_pixels
exclusion_radius: 0.0  # Minimum centre-to-centre distance in Angstrom
max_placement_attempts: 1000
