train:
  # --- Model architecture ---
  embedding:
    model: RESNET18
    out_dim: 128
  classifier:
    model: MLP
    num_classes: 44         # Must match number of models in model_file
    num_layers: 8
    nodes_per_layer: 128
    dropout: 0.05

  # --- Hyperparameters ---
  learning_rate: 0.0005
  one_cycle_scheduler: true
  clip_gradient: 5.0
  weight_decay: 0.001
  batch_size: 128

  # --- Training loop ---
  epochs: 150
  device: cuda
  n_workers: 4
  saving_frequency: 20
  simulation_batch_size: 1024
  batches_per_epoch: 100    # simulation batches consumed per epoch
  prefetch_factor: 4        # queue depth ≈ prefetch_factor * n_workers
  train_from_checkpoint: false
  checkpoint_file: null
  use_amp: false
  compile_model: false

  # --- Output ---
  output:
    checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints
    tensorboard_dir: ${hydra:runtime.output_dir}/tensorboard_logs
    estimator_file: ${hydra:runtime.output_dir}/estimator.pt
