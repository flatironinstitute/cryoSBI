defaults:
  # inference_schema attaches the InferenceAppConfig dataclass schema to the
  # composed config so typos at the CLI error at startup.
  - inference_schema
  - train
  - _self_

inference:
  folder_with_mrcs: ???       # required — override on command line
  estimator_weights: ???      # required — override on command line
  suffix: null             # output filenames: likelihoods_<suffix>.pt, embeddings_<suffix>.pt
  num_workers: 2              # 0 = synchronous loading (no DataLoader worker processes)
  output_dir: .
  prefetch_factor: 2          # only used when num_workers > 0
  max_batch_size: 32
  whitening: true
  invert_contrast: true       # flip sign of input images (matches simulator-positive vs MRC-negative density)
  down_sampled_size: null     # if set, down-sample input images to this size (before whitening and normalization)
  device: cuda                # falls back to cpu when CUDA isn't available
